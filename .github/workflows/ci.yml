name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Kernel (lint, types, tests, ledger + secret checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database; not a secret. Tests create and drop their own databases.
      SERENE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras --group dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (incl. Postgres ledger + Hypothesis invariants)
        run: uv run pytest
      - name: Ledger replay / hash-chain self-check
        run: uv run python scripts/ledger_selfcheck.py
      - name: Secret / PII scan
        run: uv run python scripts/secret_scan.py

  eval-smoke:
    name: Inspect AI eval smoke (no model keys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --all-extras --group dev
      - name: Run deterministic kernel-invariant scenarios through Inspect AI
        run: >-
          uv run inspect eval eval/tasks/kernel_invariants.py --model mockllm/model
          --log-dir eval/reports/local --display plain

  web:
    name: Web (next.js typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
